<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Website pribadi Patrick Hartono.">
    <title>Patrick Hartono</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ec;
        --ink: #1d262f;
        --muted: #66717d;
        --accent: #256f74;
        --line: rgba(29, 38, 47, 0.14);
        --surface: rgba(255, 255, 255, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(37, 111, 116, 0.14), transparent 42%),
          linear-gradient(315deg, rgba(154, 89, 64, 0.14), transparent 38%),
          var(--bg);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .intro {
        width: min(100%, 860px);
        display: grid;
        grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
        gap: 40px;
        align-items: center;
      }

      .photo {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 22px 70px rgba(29, 38, 47, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.65);
        background: var(--surface);
      }

      .content {
        padding: 8px 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--accent);
        background: var(--surface);
        font-size: 14px;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(42px, 7vw, 76px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.7;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      .links span {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.54);
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
      }

      @media (max-width: 680px) {
        main {
          place-items: start center;
          padding-top: 28px;
        }

        .intro {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        .photo {
          max-width: 220px;
          border-radius: 20px;
        }

        h1 {
          margin-top: 18px;
          font-size: 44px;
        }

        p {
          font-size: 16px;
        }

        .links span {
          flex: 1 1 140px;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-label="Perkenalan">
        <img class="photo" src="images/Profile-Pic.png" alt="Foto profil Patrick Hartono">
        <div class="content">
          <span class="status">Website pribadi sedang disiapkan</span>
          <h1>Patrick Hartono</h1>
          <p>
            Sementara halaman lengkapnya masih dirapikan, ini adalah landing page sederhana untuk
            menandai rumah digital saya di GitHub Pages.
          </p>
          <nav class="links" aria-label="Tautan utama">
            <span>Email soon</span>
            <span>GitHub soon</span>
            <span>LinkedIn soon</span>
          </nav>
        </div>
      </section>
    </main>
  </body>
</html>
